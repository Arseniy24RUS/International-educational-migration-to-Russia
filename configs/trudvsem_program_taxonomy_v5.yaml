version: trudvsem_program_taxonomy_v5
source: ЕЦП «Работа в России» — открытый API вакансий
classification_principle: >-
  Поисковый запрос используется только для сбора кандидатов и никогда не является
  доказательством принадлежности вакансии. Классификация опирается на должность,
  типовую позицию, профессиональную сферу, квалификацию и явно перечисленные навыки.
programs:
  digital_analytics:
    label_ru: Цифровая аналитика и Data/AI
    queries: [SQL, Python, аналитик данных, бизнес-аналитик, BI, машинное обучение]
    title_high:
      - '\b(аналитик данных|data analyst|data scientist|bi[- ]?аналитик|бизнес[- ]?аналитик|системн(?:ый|ая) аналитик|аналитик бизнес[- ]?процессов)\b'
      - '\b(инженер данных|data engineer|специалист по данным|специалист по информационным системам|специалист по информационной безопасности|системный администратор)\b'
      - '\b(программист|разработчик программного обеспечения|software developer|инженер[- ]?программист)\b'
      - '\b(машинн\w* обучен\w*|искусственн\w* интеллект\w*|нейросет\w*)\b'
    title_medium:
      - '\b(аналитик|разработчик|цифров\w* трансформац\w*|информационн\w* систем\w*)\b'
    skill_patterns:
      - '\b(sql|python|power bi|tableau|data analysis|анализ данных|машинн\w* обучен\w*|искусственн\w* интеллект\w*)\b'
    negative_patterns:
      - '\b(лабораторн\w* аналитик|химик[- ]?аналитик|врач|медицинск\w*|кредитн\w* аналитик)\b'
  international_economics:
    label_ru: Международная экономика и ВЭД
    queries: [международная экономика, ВЭД, внешнеэкономическая деятельность, международная торговля, экспорт, импорт]
    title_high:
      - '\b(вэд|внешнеэкономическ\w* деятельност\w*|международн\w* торговл\w*)\b'
      - '\b(менеджер|специалист|эксперт|руководитель)\b.{0,45}\b(экспорт\w*|импорт\w*|вэд|внешнеэконом\w*)\b'
      - '\b(таможенн\w* декларант|декларант|таможенн\w* брокер|специалист по таможенн\w*)\b'
      - '\b(международн\w* логист\w*|логист\w* международн\w*)\b'
      - '\b(экономист|финансовый аналитик|аналитик по экономике|специалист по закупкам)\b'
    title_medium:
      - '\b(экспорт\w*|импорт\w*|таможенн\w*|внешн\w* торговл\w*)\b'
    skill_patterns:
      - '\b(инкотермс|incoterms|таможенн\w* оформлен\w*|внешнеторгов\w* контракт\w*|валютн\w* контрол\w*|экспортн\w* контрол\w*)\b'
    negative_patterns:
      - '\b(продавец|кассир|администратор магазина|мерчандайзер|грузчик|розничн\w* торговл\w*)\b'
  management_public:
    label_ru: Управление и государственная политика
    queries: [управление проектами, проектный менеджер, государственное управление, цифровая трансформация, управление изменениями]
    title_high:
      - '\b(руководитель проектов?|менеджер проектов?|проектн\w* менеджер|project manager|координатор проектов?)\b'
      - '\b(аналитик бизнес[- ]?процессов|специалист по управлению проектами|офис управления проектами)\b'
      - '\b(государственн\w* управлен\w*|муниципальн\w* управлен\w*|государственн\w* служащ\w*|муниципальн\w* служащ\w*)\b'
      - '\b(специалист|руководитель|директор)\b.{0,55}\b(цифров\w* трансформац\w*|управлен\w* изменен\w*)\b'
    title_medium:
      - '\b(проектн\w* офис|бизнес[- ]?процесс\w*|стратегическ\w* развит\w*)\b'
    skill_patterns:
      - '\b(управлен\w* проект\w*|project management|agile|scrum|kanban|управлен\w* изменен\w*|моделирован\w* бизнес[- ]?процесс\w*)\b'
    negative_patterns:
      - '\b(строительн\w* проект\w*|проектировщик|инженер[- ]?проектировщик)\b'
  languages_regional:
    label_ru: Иностранные языки и регионоведение
    queries: [английский язык, китайский язык, арабский язык, переводчик, международные коммуникации]
    title_high:
      - '\b(переводчик|лингвист|синхронн\w* перевод\w*)\b'
      - '\bпреподаватель\b.{0,40}\b(английск\w*|китайск\w*|арабск\w*|иностранн\w*)\b'
      - '\b(регионовед|международн\w* коммуникац\w*)\b'
    title_medium:
      - '\b(английск\w* язык\w*|китайск\w* язык\w*|арабск\w* язык\w*|иностранн\w* язык\w*)\b'
    skill_patterns:
      - '\b(английск\w* язык\w*|китайск\w* язык\w*|арабск\w* язык\w*|письменн\w* перевод\w*|устн\w* перевод\w*)\b'
    negative_patterns:
      - '\b(дошкольн\w*|воспитатель|учитель)\b'
  legal_public:
    label_ru: Международное право и комплаенс
    queries: [международное право, юрист ВЭД, комплаенс, санкционный комплаенс, персональные данные]
    title_high:
      - '\b(юрист|юрисконсульт|правовед|адвокат|начальник юридическ\w*|руководитель юридическ\w*)\b'
      - '\b(комплаенс|compliance|санкционн\w* комплаенс\w*)\b'
      - '\b(специалист|эксперт|консультант)\b.{0,45}\b(правов\w* обеспечен\w*|международн\w* прав\w*|защит\w* персональн\w* данн\w*)\b'
    title_medium:
      - '\b(юридическ\w*|правов\w* обеспечен\w*|договорн\w* работ\w*)\b'
    skill_patterns:
      - '\b(международн\w* прав\w*|комплаенс|compliance|санкционн\w* прав\w*|защит\w* персональн\w* данн\w*|договорн\w* прав\w*)\b'
    negative_patterns:
      - '\b(специалист по кадрам|инспектор по кадрам|кадров\w* делопроизвод\w*)\b'
