<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
  <title id="title">Платформа миграции: данные и аналитика</title>
  <desc id="desc">Официальные и атрибутированные источники превращаются в опубликованные витрины данных, модельные оценки и статические страницы с паспортами источников и методологическими ограничениями.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#20314f"/>
    </marker>
    <style>
      .bg{fill:#f7f8fb}
      .box{fill:#fff;stroke:#20314f;stroke-width:2.4}
      .soft{fill:#e9edf7}
      .badge{fill:#f7d36f;stroke:#20314f;stroke-width:1.8}
      .text{font-family:Arial, sans-serif;fill:#1b273d;font-size:22px;letter-spacing:0}
      .title{font-weight:700;font-size:28px}
      .boxhead{font-weight:700;font-size:25px}
      .small{font-size:22px}
      .muted{fill:#5b6678;font-size:20px}
      .badgeText{font-size:20px}
      .line{stroke:#20314f;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1000" height="850"/>
  <text class="text title" x="52" y="58">Платформа миграции: данные и аналитика</text>
  <rect class="box soft" x="70" y="90" width="860" height="240" rx="10"/>
<text class="text boxhead" x="98" y="132">Официальные и атрибутированные источники</text>
<text class="text small" x="98" y="172">контингент студентов UNESCO UIS OPRI</text>
<text class="text small" x="98" y="200">UN WPP, World Bank и голосования ООН</text>
<text class="text small" x="98" y="228">данные МГИМО, Trudvsem и Natural Earth</text>
<text class="text small muted" x="98" y="286">Для источников указаны лицензии и даты извлечения.</text>
  <line class="line" x1="500" y1="342" x2="500" y2="366"/>
  <rect class="box" x="70" y="370" width="860" height="220" rx="10"/>
<text class="text boxhead" x="98" y="412">Витрины данных и модельные оценки</text>
<text class="text small" x="98" y="452">манифесты и паспорта источников</text>
<text class="text small" x="98" y="480">наблюдаемый контингент UIS и признаки страна-год</text>
<text class="text small" x="98" y="508">карточка PPML-модели, сценарии и матрица разрыва</text>
<rect class="badge" x="564" y="524" width="332" height="44" rx="8"/>
<text class="text small badgeText" x="582" y="552">Контингент — не годовой прием</text>
  <line class="line" x1="500" y1="602" x2="500" y2="628"/>
  <rect class="box" x="70" y="630" width="860" height="165" rx="10"/>
<text class="text boxhead" x="98" y="672">Статический интерфейс Pages</text>
<text class="text small" x="98" y="712">страновые наблюдения и панель источника</text>
<text class="text small" x="98" y="740">диагностика модели и слайдер прогноза</text>
<text class="text small" x="98" y="768">рейтинг разрыва, матрица программ и доклад</text>
  <rect class="box" x="105" y="810" width="790" height="34" rx="8"/>
  <text class="text small" x="125" y="834">Сценарий: страна -&gt; контингент -&gt; источник -&gt; модель -&gt; прогноз</text>
</svg>
